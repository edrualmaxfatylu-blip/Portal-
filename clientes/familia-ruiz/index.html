<style>
:root{--tinta:#3b2f4a;--suave:#7a6a86;--crema:#fff8f0;--rojo:#d9475a;--oro:#f2c46d;--pino:#5aa894;
  --serif:"Crimson Text",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#2b2d5c}
body{font:16px/1.5 var(--sans);color:var(--tinta);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:#f6d6c8}
.reel #app{max-width:none}
.etapa{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.7,0,.25,1),opacity 1.1s;will-change:transform}
.etapa svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.etapa.arriba{transform:translateY(-100%)}
.etapa.abajo{transform:translateY(100%)}
/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(22px + env(safe-area-inset-top)) 26px 0;text-align:center;pointer-events:none;transition:opacity .5s}
.hud .num{font:600 .7rem/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;opacity:.7}
.hud h1{font:italic 400 clamp(2rem,9vw,2.6rem)/1.05 var(--serif);margin-top:10px;letter-spacing:-.01em;text-wrap:balance}
.hud p{font-size:.95rem;margin-top:8px;opacity:.8}
.claro .hud,.claro .pista{color:#fff8f0}
.pista{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;background:rgba(255,248,240,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font:600 .92rem/1 var(--sans);white-space:nowrap;pointer-events:none;transition:opacity .4s;box-shadow:0 10px 30px -12px rgba(59,47,74,.45)}
.claro .pista{background:rgba(43,45,92,.55);color:#fff8f0}
.pista i{width:10px;height:10px;border-radius:50%;background:currentColor;animation:late 1.3s infinite}
.pista.oculta,.hud.oculta{opacity:0}
@keyframes late{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.15);opacity:1}}
.puntos{position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:20;display:grid;gap:9px;pointer-events:none}
.puntos b{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;transition:opacity .4s,transform .4s}
.puntos b.si{opacity:1;transform:scale(1.3)}
.claro .puntos{color:#fff8f0}
/* nieve */
.nieve{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.nieve i{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:cae linear infinite}
@keyframes cae{to{transform:translate3d(30px,110vh,0)}}
/* sobre */
.portada .hud{top:auto;bottom:calc(120px + env(safe-area-inset-bottom))}
.btn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;
  font:600 1rem/1 var(--sans);text-decoration:none;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn-tinta{background:var(--tinta);color:#fff8f0}
.btn-borde{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn-wa{background:#1faa59;color:#fff}
#abrir{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:21}
.para{font:600 .72rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin-top:14px}
.para b{display:block;font:italic 400 1.5rem/1.1 var(--serif);letter-spacing:0;text-transform:none;margin-top:8px;opacity:1}
/* mensaje final */
.hoja{position:absolute;left:0;right:0;bottom:0;z-index:30;max-height:78%;overflow-y:auto;background:var(--crema);border-radius:30px 30px 0 0;
  padding:30px 26px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(20,16,40,.5);text-align:center}
.hoja.si{transform:none}
.hoja .tipo{font:600 .7rem/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--suave)}
.hoja h2{font:italic 400 2.5rem/1 var(--serif);margin:12px 0 6px;color:var(--rojo)}
.hoja .inv{font:italic 400 1.35rem/1.2 var(--serif);margin-bottom:14px}
.hoja .frase{color:var(--suave);max-width:32ch;margin:0 auto 16px}
.hoja .de{font:600 .95rem/1.4 var(--sans);margin-bottom:18px}
.hoja .de span{display:block;font:500 .7rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--suave);margin-bottom:6px}
.cuenta{margin:4px 0 18px}
.cuenta p{font:600 .66rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--suave);margin-bottom:10px}
.cuenta div{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cuenta span{background:#fff;border:1px solid #f0e2d4;border-radius:16px;padding:10px 4px 8px}
.cuenta b{display:block;font:italic 400 2rem/1 var(--serif);color:var(--tinta)}
.cuenta small{font:600 .58rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.datos{display:grid;gap:8px;margin:0 0 18px;text-align:left}
.datos div{background:#fff;border:1px solid #f0e2d4;border-radius:16px;padding:12px 14px}
.datos small{display:block;font:600 .64rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--suave);margin-bottom:5px}
.acciones{display:grid;gap:10px}
.credito{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:.8rem;color:#5f5c7a;text-decoration:none}
.credito svg{width:22px;height:22px}.credito b{font:800 .95rem/1 var(--sans);letter-spacing:-.03em;color:#171532}.credito b span{color:#ff6b4a}
.demo{display:inline-block;margin-bottom:14px;font:600 .62rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;background:#ffefc2;color:#5a4300;padding:6px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.etapa{transition:none}.nieve{display:none}.pista i{animation:none}}
</style>
</head>
<body>
<div id="app">
  <!-- 0 · SOBRE -->
  <section class="etapa portada" id="e0">
    <svg id="s0" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  <!-- 1 · CAMINO -->

  </section>
  <!-- 2 · ÁRBOL -->
  <section class="etapa abajo" id="e2">
    <svg id="s2" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-label="Escena: el árbol de escalones"></svg>
    <div class="hud"><p class="num">II · III</p><h1>El árbol de los escalones</h1></div>

  <section class="etapa abajo claro" id="e3">
    <svg id="s3" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-label="Escena: la estrella y la casita"></svg>
    <div class="hud" id="h3"><p class="num">III · III</p><h1>La estrella</h1></div>
  </section>

  <div class="nieve" id="nieve"></div>
  
  <div class="pista oculta" id="pista"><i></i><span id="pistaT"></span></div>

  <div class="hoja" id="hoja" role="dialog" aria-label="Mensaje">
    <span class="demo" id="demo" hidden>Demostración</span>
    <p class="tipo" id="mTipo"></p>
    <h2 id="mTit"></h2>
    <p class="inv" id="mInv" hidden></p>
    <div class="cuenta" id="cuenta" hidden><p id="cuentaT"></p><div><span><b id="cD">0</b><small>días</small></span><span><b id="cH">0</b><small>horas</small></span><span><b id="cM">0</b><small>min</small></span><span><b id="cS">0</b><small>seg</small></span></div></div>
    <p class="frase" id="mFrase"></p>
    <p class="de" id="mDe" hidden><span id="mDeT"></span><b id="mDeN"></b></p>
    <div class="datos" id="mDatos" hidden></div>
    <div class="acciones" id="mAcc"></div>
    <a class="credito" href="https://portalab.com.mx/" id="credito"><span id="pie"></span>
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#171532"/><path d="M15 37V23a9 9 0 0 1 18 0v14" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/><circle cx="24" cy="26" r="3.2" fill="#ff6b4a"/><circle cx="36.5" cy="11.5" r="2.6" fill="#b9b4ff"/></svg>
      <b>porta<span>lab</span></b></a>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — lo único que se edita. Campo vacío = no se muestra.
   Enlace por invitado:  .../#para=Familia+López     Modo reel (se juega solo):  .../#reel
   ===================================================================== */
const CONFIG={
  modo: "tarjeta",                          // "tarjeta" = felicitación · "posada" = invitación con fecha, lugar y confirmación
  tipo: "Una tarjeta de la Familia Ruiz",   // texto pequeño del sobre
  titulo: "El camino de la estrella",       // título del sobre
  abrir: "Abrir",                           // botón del sobre
  mensajeTitulo: "¡Feliz Navidad!",         // título del mensaje final
  frase: "Fatylu, papá y abuelito te desean una Navidad llena de luz, paz y cariño. Que la estrella te guíe siempre de vuelta a casa.",
  de: "Fatylu, papá y abuelito · Familia Ruiz", // quién felicita o invita
  // Solo en modo "posada":
  fecha: "",                                // ej. "Viernes 19 de diciembre · 7:00 pm"
  lugar: "",                                // ej. "Calle Ejemplo 123, Naucalpan"
  mapa: "",                                 // enlace de Google Maps (opcional)
  confirmar: "",                            // WhatsApp para confirmar, ej. "525500000000"; vacío = sin botón
  mensajeConfirmar: "Hola, confirmo mi asistencia a la posada.",
  cuentaRegresiva: "2026-12-25T00:00:00",                    // ej. "2026-12-25T00:00:00" = cuenta regresiva en el mensaje final; vacío = sin cuenta
  cuentaTexto: "Faltan para Navidad",       // texto arriba de la cuenta regresiva
  perros: ["chihuahua", "pastor", "chihuahua"],                             // perritos en sombra que acompañan al peregrino: "chihuahua", "pastor"
  pie: "Hecha por",
  demo: false,                              // true = muestra "Demostración"; false al entregar
  color: "#d9475a", color2: "#3b2f4a", acento: "#f2c46d", acento2: "#5aa894", fondo: "#f6d6c8"   // muestra de colores en el simulador
};
</script>

<script>
(function(){
"use strict";
const C = CONFIG, NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const vacio = v => v == null || (typeof v === "string" && !v.trim());
const params = new URLSearchParams((location.hash || "").slice(1));
const REEL = params.has("reel");
const MOV = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const para = (params.get("para") || "").slice(0, 60).trim();
if (REEL) document.documentElement.classList.add("reel");

/* ---------- utilidades SVG ---------- */
function S(tag, at, padre){ const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (padre) padre.appendChild(e); return e; }
const pts = arr => arr.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const lerp = (a, b, t) => a + (b - a) * t;
const esperar = ms => new Promise(r => setTimeout(r, ms));
const suave = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const rebote = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(t - 1, 3) + c1*Math.pow(t - 1, 2); };
function tween(ms, fn, ease = suave){ return new Promise(res => { if (!MOV) ms = Math.min(ms, 120); const t0 = performance.now();
  (function paso(ahora){ const t = Math.min(1, (ahora - t0)/ms); fn(ease(t), t); if (t < 1) requestAnimationFrame(paso); else res(); })(t0); }); }

/* ---------- materiales pastel ---------- */
const MAT = {
  piedra: ["#fff3e6", "#f2b8a2", "#d98f84"],
  rosa:   ["#ffe3e8", "#f3a9ba", "#d4849b"],
  pino:   ["#d3f2e5", "#86cfb8", "#5fae98"],
  pino2:  ["#c3ead9", "#73c0a7", "#4f9c86"],
  oro:    ["#fff1c4", "#f4c86a", "#d9a443"],
  lila:   ["#efe9ff", "#bbb0f1", "#968ad6"],
  nube:   ["#ffffff", "#f1e6f5", "#ddd0ea"],
  noche:  ["#c9c3ef", "#8b84c9", "#6a63a8"]
};

/* proyección isométrica por escena */
function iso(OX, OY, U = 22){ const V = U/2, H = U; return (x, y, z) => [OX + (x - y)*U, OY + (x + y)*V - z*H]; }

/* caja (prisma) con sus tres caras visibles */
function caja(P, x, y, z, w, d, h, m, padre){
  const c = MAT[m] || m, g = S("g", {}, padre);
  const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  S("polygon", { points: pts([P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)]), fill: c[1] }, g);
  S("polygon", { points: pts([P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)]), fill: c[2] }, g);
  S("polygon", { points: pts(t), fill: c[0] }, g);
  S("polyline", { points: pts([t[3], t[0], t[1]]), fill: "none", stroke: "rgba(255,255,255,.75)", "stroke-width": .9 }, g);
  return g;
}
/* arma un mundo de bloques ordenados para que se tapen bien */
function mundo(P, lista, padre){
  const ids = {};
  lista.slice().sort((a, b) => (a.x + a.y + a.z) - (b.x + b.y + b.z) || a.z - b.z).forEach(b => {
    const g = caja(P, b.x, b.y, b.z, b.w || 1, b.d || 1, b.h || 1, b.m, padre);
    if (b.deco) b.deco(g, b);
    if (b.oculto){ g.setAttribute("opacity", 0); g.setAttribute("transform", "translate(0 150)"); }
    if (b.id) ids[b.id] = g;
  });
  return ids;
}
const cima = (P, x, y, z) => P(x + .5, y + .5, z + 1);

/* ---------- elementos decorativos ---------- */
function cielo(svg, id, c1, c2, c3){
  const d = S("defs", {}, svg);
  const lg = S("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  S("stop", { offset: 0, "stop-color": c1 }, lg); S("stop", { offset: .6, "stop-color": c2 }, lg); S("stop", { offset: 1, "stop-color": c3 }, lg);
  const f = S("filter", { id: id + "b", x: "-80%", y: "-80%", width: "260%", height: "260%" }, d); S("feGaussianBlur", { stdDeviation: 4 }, f);
  const f2 = S("filter", { id: id + "B", x: "-100%", y: "-100%", width: "300%", height: "300%" }, d); S("feGaussianBlur", { stdDeviation: 12 }, f2);
  S("rect", { width: 360, height: 640, fill: `url(#${id})` }, svg);
  return { brillo: `url(#${id}b)`, halo: `url(#${id}B)` };
}
function nube(svg, x, y, s, op = .85, dur = 26){
  const g = S("g", { opacity: op }, svg);
  [[0, 0, 26, 11], [-22, 5, 18, 8], [24, 4, 20, 9], [4, -8, 16, 9]].forEach(([dx, dy, rx, ry]) => S("ellipse", { cx: x + dx*s, cy: y + dy*s, rx: rx*s, ry: ry*s, fill: "#fff" }, g));
  if (MOV) S("animateTransform", { attributeName: "transform", type: "translate", values: "0 0; 14 0; 0 0", dur: dur + "s", repeatCount: "indefinite" }, g);
  return g;
}
function roca(svg, P, x0, y0, w, d, prof, c1 = "#e9a594", c2 = "#c98078"){
  const L = P(x0, y0 + d, 0), B = P(x0 + w, y0 + d, 0), R = P(x0 + w, y0, 0), A = [B[0] + 4, B[1] + prof];
  S("polygon", { points: pts([L, B, A]), fill: c1 }, svg);
  S("polygon", { points: pts([B, R, A]), fill: c2 }, svg);
}
function pino(svg, P, x, y, z, s = 1){
  const [cx, cy] = P(x + .5, y + .5, z), g = S("g", {}, svg);
  S("ellipse", { cx, cy, rx: 9*s, ry: 4*s, fill: "rgba(59,47,74,.15)" }, g);
  S("rect", { x: cx - 2*s, y: cy - 7*s, width: 4*s, height: 7*s, fill: "#b07a63" }, g);
  for (let k = 0; k < 3; k++){ const by = cy - 6*s - k*10*s, hw = (13 - k*3)*s, ty = by - 16*s;
    S("polygon", { points: pts([[cx - hw, by], [cx, by + 3*s], [cx, ty]]), fill: "#86cfb8" }, g);
    S("polygon", { points: pts([[cx, by + 3*s], [cx + hw, by], [cx, ty]]), fill: "#5fae98" }, g); }
  S("circle", { cx, cy: cy - 44*s, r: 2.2*s, fill: "#fff" }, g);
  return g;
}
function farolito(svg, x, y, color, F){
  const g = S("g", {}, svg);
  S("circle", { cx: x, cy: y, r: 13, fill: color, opacity: .55, filter: F.brillo }, g);
  S("line", { x1: x, y1: y - 26, x2: x, y2: y - 8, stroke: "rgba(59,47,74,.35)", "stroke-width": 1 }, g);
  S("rect", { x: x - 5, y: y - 8, width: 10, height: 14, rx: 4, fill: color }, g);
  S("rect", { x: x - 3, y: y - 10, width: 6, height: 3, rx: 1, fill: "#b07a63" }, g);
  if (MOV) S("animateTransform", { attributeName: "transform", type: "rotate", values: `-4 ${x} ${y - 26}; 4 ${x} ${y - 26}; -4 ${x} ${y - 26}`, dur: "4s", repeatCount: "indefinite" }, g);
  return g;
}
function regalo(P, x, y, z, m, cinta, padre){
  const g = caja(P, x, y, z, .7, .7, .6, m, padre);
  const a = P(x + .35, y, z + .6), b = P(x + .35, y + .7, z + .6), c = P(x, y + .35, z + .6), d2 = P(x + .7, y + .35, z + .6);
  S("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: cinta, "stroke-width": 2.4 }, g);
  S("line", { x1: c[0], y1: c[1], x2: d2[0], y2: d2[1], stroke: cinta, "stroke-width": 2.4 }, g);
  const t = P(x + .35, y + .35, z + .6);
  S("circle", { cx: t[0] - 3, cy: t[1] - 3, r: 3, fill: "none", stroke: cinta, "stroke-width": 2 }, g);
  S("circle", { cx: t[0] + 3, cy: t[1] - 3, r: 3, fill: "none", stroke: cinta, "stroke-width": 2 }, g);
  return g;
}
function estrellas(svg, n, y1 = 400){
  for (let i = 0; i < n; i++){ const c = S("circle", { cx: Math.random()*360, cy: Math.random()*y1, r: (.6 + Math.random()*1.4).toFixed(1), fill: "#fff", opacity: (.3 + Math.random()*.6).toFixed(2) }, svg);
    if (MOV) S("animate", { attributeName: "opacity", values: "0.2;1;0.2", dur: (2 + Math.random()*3).toFixed(1) + "s", begin: (-Math.random()*3).toFixed(1) + "s", repeatCount: "indefinite" }, c); }
}

/* ---------- el peregrino (personaje original) ---------- */
function peregrino(svg, F){
  const g = S("g", {}, svg), cuerpo = S("g", {}, g);
  S("ellipse", { cx: 0, cy: 0, rx: 7, ry: 3, fill: "rgba(40,30,60,.22)" }, g);

function boton(cls, txt, href){ const a = document.createElement(href ? "a" : "button"); a.className = "btn " + cls; a.textContent = txt; if (href){ a.href = href; a.target = "_blank"; a.rel = "noopener"; } else a.type = "button"; acc.appendChild(a); return a; }
if (POSADA){
  const datos = $("mDatos");
  [["Cuándo", C.fecha], ["Dónde", C.lugar]].forEach(([k, v]) => { if (vacio(v)) return; const d = document.createElement("div"), s = document.createElement("small"); s.textContent = k; d.append(s, document.createTextNode(v)); datos.appendChild(d); datos.hidden = false; });
  if (!vacio(C.confirmar)) boton("btn-wa", "Confirmar por WhatsApp", "https://wa.me/" + String(C.confirmar).replace(/\D/g, "") + "?text=" + encodeURIComponent(C.mensajeConfirmar + (para ? " (" + para + ")" : "")));
  if (!vacio(C.mapa) || !vacio(C.lugar)) boton("btn-borde", "Cómo llegar", !vacio(C.mapa) ? C.mapa : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.lugar));
}
if (!vacio(C.cuentaRegresiva)){
  const meta = new Date(C.cuentaRegresiva);
  if (!isNaN(meta)){
    $("cuenta").hidden = false; $("cuentaT").textContent = C.cuentaTexto || "Faltan para Navidad";
    const pinta = () => { let ms = meta - Date.now();
      if (ms <= 0){ $("cuentaT").textContent = "¡Ya es Navidad!"; ["cD", "cH", "cM", "cS"].forEach(k => $(k).textContent = "0"); return; }
      const s = Math.floor(ms/1000); $("cD").textContent = Math.floor(s/86400); $("cH").textContent = Math.floor(s%86400/3600); $("cM").textContent = Math.floor(s%3600/60); $("cS").textContent = s%60; };
    pinta(); setInterval(pinta, 1000);
  }
}
const otra = boton("btn-tinta", "Ver otra vez");
otra.addEventListener("click", () => location.reload());
document.title = (C.titulo || "El camino de la estrella") + (C.de ? " · " + C.de : "");

/* nieve */
const nieve = $("nieve");
if (MOV) for (let k = 0; k < 28; k++){ const i = document.createElement("i"), s = 2 + Math.random()*5; i.style.left = Math.random()*100 + "%"; i.style.width = i.style.height = s + "px"; i.style.opacity = (.35 + Math.random()*.55).toFixed(2); i.style.animationDuration = (8 + Math.random()*9).toFixed(1) + "s"; i.style.animationDelay = (-Math.random()*14).toFixed(1) + "s"; nieve.appendChild(i); }

/* =====================================================================
   HISTORIA
   ===================================================================== */
const pista = $("pista"), pistaT = $("pistaT");
let espera = null;
function pedir(texto, objetivo, mostrar = true){
  pistaT.textContent = texto; if (mostrar) pista.classList.remove("oculta");
  return new Promise(res => {
    const listo = () => { objetivo.removeEventListener("click", listo); pista.classList.add("oculta"); espera = null; res(); };
    objetivo.addEventListener("click", listo); espera = listo;
    if (REEL) setTimeout(listo, 1500);
  });
}
function pasar(de, a, oscura){
  $(de).classList.add("abajo"); $(a).classList.remove("abajo", "arriba");
  const meta = document.querySelector("meta[name=theme-color]"); if (meta) meta.content = oscura ? "#1f2150" : "#f6d6c8";
}
function marcar(){}

async function historia(){
  await pedir("Toca para abrir", $("abrir"), false);
  $("abrir").style.opacity = 0; $("h0").classList.add("oculta");
  await tween(700, e => sobre.setAttribute("transform", `translate(0 ${(-260*e).toFixed(1)}) `));

  // I · el camino
  per1.poner(...cima(P1, 0, 3, 0));
  pasar("e0", "e1"); marcar(0); await esperar(REEL ? 1200 : 1100);
  await caminar(per1, ruta1a);
  await pedir("Toca la manivela", s1);
  anillo.remove();
  tween(1200, e => brazo.setAttribute("transform", `rotate(${(e*720).toFixed(1)} ${mc[0]} ${mc[1] - 3})`));
  await Promise.all([subir(I1.p1, 0), subir(I1.p2, 220), subir(I1.p3, 440)]);
  await caminar(per1, ruta1b);
  await esperar(250);

  // II · el árbol
  per2.poner(...cima(P2, 3, 3, 0));
  pasar("e1", "e2"); marcar(1); await esperar(1200);
  anillo2.setAttribute("opacity", .8);
  if (MOV){ S("animate", { attributeName: "r", values: "60;90;60", dur: "1.8s", repeatCount: "indefinite" }, anillo2); S("animate", { attributeName: "opacity", values: ".8;0;.8", dur: "1.8s", repeatCount: "indefinite" }, anillo2); }
  await pedir("Toca el árbol para girarlo", s2);
  anillo2.remove();
  const ox = P2(0, 0, 0)[0];
  await tween(1500, (e) => { const s = Math.cos(e*Math.PI*4); arbolG.setAttribute("transform", `translate(${ox} 0) scale(${s.toFixed(3)} 1) translate(${-ox} 0)`);
    focos.forEach((f, i) => { if (e > i/focos.length) f.setAttribute("opacity", 1); }); });
  arbolG.removeAttribute("transform");
  focos.forEach(f => f.setAttribute("opacity", 1));
  await caminar(per2, ruta2, 420);
  await tween(700, e => { punta.setAttribute("opacity", (.55 + .45*e).toFixed(2)); halo2.setAttribute("opacity", (e*.9).toFixed(2)); });
  await esperar(600);

  // III · la estrella y la casita
  per3.poner(...cima(P3, 3, 2.2, 0));
  per3.cuerpo.setAttribute("transform", "scale(-1 1)"); per3.dir = -1;
  pasar("e2", "e3", true); marcar(2); await esperar(1200);
  await pedir("Toca la estrella", pin);
  { const a = pin.querySelector("animateTransform"); if (a) a.remove(); }
  // golpe y explosión
  await tween(500, (e, t) => pin.setAttribute("transform", `rotate(${(Math.sin(t*Math.PI*6)*10*(1 - t)).toFixed(2)} ${PX} 0)`), t => t);
  romper();
  await Promise.all(picos.map(({ g, a }, i) => tween(900, e => { g.setAttribute("transform", `translate(${(Math.cos(a)*90*e).toFixed(1)} ${(Math.sin(a)*90*e + 60*e*e).toFixed(1)}) rotate(${(e*120*(i % 2 ? 1 : -1)).toFixed(1)} ${PX} ${PY})`); g.setAttribute("opacity", (1 - e).toFixed(2)); })));
  tween(900, e => { haloP.setAttribute("opacity", (.25 + .2*e).toFixed(2)); haloP.setAttribute("r", (60 - 8*e).toFixed(1)); centro.setAttribute("transform", `translate(${PX} ${PY}) scale(${(1 - .25*e).toFixed(3)}) translate(${-PX} ${-PY})`); });
  $("h3").querySelector("h1").textContent = "Una casita para llegar";
  await subir(casa, 200, 900);
  await caminar(per3, [cima(P3, 2.6, 1, 0)]);
  await pedir("Toca la casita", casa);
  // la casita se despliega
  await Promise.all([
    tween(900, e => casa.techo.setAttribute("transform", `translate(${(10*e).toFixed(1)} ${(-90*e).toFixed(1)}) rotate(${(-12*e).toFixed(1)} 180 380)`)),
    tween(900, e => { casa.paredI.setAttribute("transform", `translate(${(-34*e).toFixed(1)} ${(18*e).toFixed(1)})`); casa.paredI.setAttribute("opacity", (1 - e).toFixed(2)); casa.ventana.setAttribute("opacity", (1 - e).toFixed(2)); }),
    tween(900, e => { casa.paredD.setAttribute("transform", `translate(${(34*e).toFixed(1)} ${(18*e).toFixed(1)})`); casa.paredD.setAttribute("opacity", (1 - e).toFixed(2)); }),
    tween(900, e => luz.setAttribute("opacity", e.toFixed(2)))
  ]);
  $("h3").classList.add("oculta");
  await esperar(300);
  $("hoja").classList.add("si");
}
function romper(){
  const cols = ["#f3a9ba", "#86cfb8", "#bbb0f1", "#f2c46d", "#fff8f0", "#d9475a"];
  const piezas = [];
  for (let i = 0; i < 46; i++){
    const a = Math.random()*Math.PI*2, v = 60 + Math.random()*120, r = 2 + Math.random()*3;
    const e = Math.random() > .5 ? S("circle", { cx: PX, cy: PY, r, fill: cols[i % cols.length] }, confeti) : S("rect", { x: PX - r, y: PY - r/2, width: r*2, height: r, rx: 1, fill: cols[i % cols.length] }, confeti);
    piezas.push({ e, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60, rot: Math.random()*360 });
  }
  tween(2200, (e, t) => piezas.forEach(p => { const x = p.vx*t*1.4, y = p.vy*t*1.4 + 260*t*t; p.e.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(p.rot + t*400).toFixed(0)} ${PX} ${PY})`); p.e.setAttribute("opacity", (1 - t*t).toFixed(2)); }), t => t);
}
historia();
})();
</script>
