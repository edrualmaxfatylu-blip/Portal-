<style>

.hero{background:radial-gradient(80% 60% at 100% 0,rgba(255,255,255,.14),transparent 62%),radial-gradient(60% 50% at 0 100%,color-mix(in srgb,var(--a) 34%,transparent),transparent 65%),var(--c);color:#fbf8ff;border-radius:0 0 34px 34px;padding:calc(22px + env(safe-area-inset-top,0px)) 0 30px;overflow:hidden;position:relative}

.ondas{position:absolute;right:-90px;top:-90px;width:280px;height:280px;fill:none;stroke-width:2;pointer-events:none}

.marca{display:flex;align-items:center;gap:12px}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.barra .btn{max-width:480px;margin:0 auto;box-shadow:0 14px 28px -10px rgba(23,21,50,.45)}
.verp{background:var(--c);color:#fff;justify-content:space-between}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style></head>

<script>

// ==========================================================================
(function(){

var $$=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:2,minimumFractionDigits:0});

(C.etiquetas||[]).forEach(function(t){if(t)$("#chips").appendChild(el("span","",t))});$("#chips").hidden=!$("#chips").children.length;
